[project]
name = "atlas-voix"
version = "0.4.0"
description = "Voix d'Atlas : écoute (mot d'éveil, parole vers texte) et voix (texte vers parole), modules séparés du socle."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2",
    "sounddevice>=0.5",
    "faster-whisper>=1.2,<2",
    "openwakeword>=0.6,<0.7",
    "piper-tts>=1.8.0",
    "parakeet-mlx>=0.3 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mlx-audio>=0.6 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "mistral-common[audio]>=1.8 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[project.scripts]
atlas-ecoute = "atlas_voix.ecoute:main"
atlas-voix = "atlas_voix.voix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_voix"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
# openwakeword exige tflite-runtime sous Linux, sans paquet pour Python 3.12 et plus : Linux au J12 (onnxruntime seul).
environments = ["sys_platform == 'darwin'", "sys_platform == 'win32'"]
