# Fiche du module « voix » : ce que le socle lit avant d'installer (J10). Un dépôt contient plusieurs modules, chacun
# dans son dossier avec cette fiche.
nom = "Voix"
description = "Parle à Atlas à voix haute et entends ses réponses : écoute avec mot d'éveil, et voix."
version = "0.9.0"
socle = ">=0.1.2"           # version d'Atlas demandée : la première qui installe les paquets compilés et les options
plateformes = ["macos", "windows"]   # là où le module marche (pyproject.toml : openwakeword n'a pas de paquet Linux) ; Linux au J12
programmes = ["uv"]         # Atlas le télécharge (avec ton accord) s'il manque ; `say` et `afplay` seulement pour le moteur Mac
preparation = ["uv", "sync", "--project", "{dossier}", "--frozen", "--no-dev", "{options}"]   # lancé une fois le module copié : prépare son Python, avec les moteurs cochés
telechargements = ["l'écoute (mot d'éveil et micro, 230 Mo)", "le modèle du mot d'éveil « Hey Jarvis » (10 Mo)"]   # dit avant l'installation, en plus de uv
etapes = [["uv", "run", "--project", "{dossier}", "atlas-ecoute", "--telecharger-eveil"]]   # lancées après la préparation

# Les fiches que le cœur lit : une entrée (Écoute) et une sortie (Voix), activées et réglées séparément.
# Le Python et ses paquets vivent dans l'environnement `uv` de ce dossier.
[[fiches]]
fichier = "fiches/ecoute.toml"
dossier = "entrees"
[[fiches]]
fichier = "fiches/voix.toml"
dossier = "sorties"

# Les moteurs, cochés à l'installation et changeables ensuite sur la fiche du module. Les tailles sont ce que chacun
# ajoute sur le disque (mesuré le 07/11/2026) ; Parakeet et Voxtral partagent MLX, ensemble ils prennent moins.
[[options]]
id = "whisper"
nom = "Whisper"
description = "transcription de ta voix, sur Mac et Windows"
taille = "60 Mo"
coche = true
arguments = ["--extra", "whisper"]

[[options]]
id = "parakeet"
nom = "Parakeet"
description = "transcription bien plus rapide, sur un Mac à puce Apple"
taille = "390 Mo"
plateformes = ["macos"]
arguments = ["--extra", "parakeet"]

[[options]]
id = "piper"
nom = "Piper"
description = "voix locales, sur Mac et Windows"
taille = "50 Mo"
coche = true
arguments = ["--extra", "piper"]

[[options]]
id = "voxtral"
nom = "Voxtral"
description = "voix de Mistral, plus naturelles et plus lentes, sur un Mac à puce Apple"
taille = "410 Mo"
plateformes = ["macos"]
arguments = ["--extra", "voxtral"]

# La version publiée n'a pas le code : scripts/publier.sh lance construire.sh, qui compile le code du module (Cython)
# et joint le paquet à la version. Les paquets Python, eux, viennent de PyPI à l'installation, comme en développement.
[paquet]
construction = "construire.sh"
